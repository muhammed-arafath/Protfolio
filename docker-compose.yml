services:
  portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://arafath.dev}
        NEXT_PUBLIC_FORM_ENDPOINT: ${NEXT_PUBLIC_FORM_ENDPOINT:-}
    image: arafath-portfolio:latest
    container_name: arafath-portfolio
    ports:
      - "7510:7510"
    restart: unless-stopped
